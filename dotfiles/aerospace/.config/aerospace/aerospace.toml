# ~/.aerospace.toml — Marco's personal config
# Based on default-config.toml, with two changes from the default:
# 1) workspaces 1/2/3 are pinned to the 3 fixed monitors (see workspace-to-monitor-force-assignment)
# 2) switching/moving workspaces by number is bound to alt+cmd instead of alt,
#    because on an Italian keyboard Option+number produces symbols (e.g. Option+5 = ~)
#    and AeroSpace would intercept that combo before macOS could type the character.

config-version = 2

after-startup-command = []
start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# Only these workspaces are retained when empty. All other workspaces are
# created on first use and disappear again after their last window is closed.
persistent-workspaces = ["1", "2", "3"]

on-mode-changed = []
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

# Automatic rules: when a new window appears, AeroSpace checks
# this list in order and applies the first 'run' whose 'if' matches.
# This must stay here, BEFORE the first [table] in the file: in TOML, root-level
# ("loose") keys must be declared before any [...] header.
# app-bundle-id can be found with `mdls -name kMDItemCFBundleIdentifier -r /Applications/App.app`
on-window-detected = [
    { if = 'test %{app-bundle-id} = com.apple.reminders', run = 'move-node-to-workspace 1' },
]

gaps.inner.horizontal = 5
gaps.inner.vertical =   5
gaps.outer.left =       5
gaps.outer.bottom =     5
gaps.outer.top =        5
gaps.outer.right =      5

# Pin workspaces 1/2/3 to the 3 physical monitors of the desk setup.
# If you're only working on the laptop, workspaces 1 and 2 have no monitor to
# appear on until you reconnect the other screens: they fall back into place
# on their own once reattached. Patterns are substring matches on the monitor name
# (from `aerospace list-monitors`).
#
[workspace-to-monitor-force-assignment]
1 = ['XG259QN', 'Built-in']  # central ultrawide
2 = ['LC34G55T', 'Built-in'] # left 16:9
3 = 'Built-in'                # laptop

[mode.main.binding]

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Switch workspace: alt+cmd+number (not alt alone, to avoid stealing
    # the symbols the Italian layout types with Option+number)
    alt-cmd-1 = 'workspace 1' # workspace renamed, the key stays 1
    alt-cmd-2 = 'workspace 2'
    alt-cmd-3 = 'workspace 3'
    alt-cmd-4 = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh 4'
    alt-cmd-5 = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh 5'
    alt-cmd-6 = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh 6'
    alt-cmd-7 = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh 7'
    alt-cmd-8 = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh 8'
    alt-cmd-9 = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh 9'

    # Letter workspaces: Italian accented vowels have their own
    # physical key (à, è, ì, ò, ù), so alt+letter doesn't steal anything here.
    alt-a = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh A'
    alt-b = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh B'
    alt-c = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh C'
    alt-d = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh D'
    alt-e = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh E'
    alt-f = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh F'
    alt-g = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh G'
    alt-i = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh I'
    alt-m = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh M'
    alt-n = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh N'
    alt-o = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh O'
    alt-p = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh P'
    alt-q = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh Q'
    alt-r = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh R'
    alt-s = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh S'
    alt-t = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh T'
    alt-u = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh U'
    alt-v = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh V'
    alt-w = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh W'
    alt-x = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh X'
    alt-y = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh Y'
    alt-z = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh Z'

    # Move the active window to a workspace: same alt+cmd+number scheme
    alt-cmd-shift-1 = 'move-node-to-workspace 1'
    alt-cmd-shift-2 = 'move-node-to-workspace 2'
    alt-cmd-shift-3 = 'move-node-to-workspace 3'
    alt-cmd-shift-4 = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window 4'
    alt-cmd-shift-5 = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window 5'
    alt-cmd-shift-6 = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window 6'
    alt-cmd-shift-7 = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window 7'
    alt-cmd-shift-8 = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window 8'
    alt-cmd-shift-9 = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window 9'
    alt-shift-a = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window A'
    alt-shift-b = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window B'
    alt-shift-c = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window C'
    alt-shift-d = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window D'
    alt-shift-e = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window E'
    alt-shift-f = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window F'
    alt-shift-g = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window G'
    alt-shift-i = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window I'
    alt-shift-m = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window M'
    alt-shift-n = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window N'
    alt-shift-o = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window O'
    alt-shift-p = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window P'
    alt-shift-q = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window Q'
    alt-shift-r = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window R'
    alt-shift-s = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window S'
    alt-shift-t = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window T'
    alt-shift-u = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window U'
    alt-shift-v = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window V'
    alt-shift-w = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window W'
    alt-shift-x = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window X'
    alt-shift-y = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window Y'
    alt-shift-z = 'exec-and-forget /bin/zsh ~/.config/aerospace/workspace-on-focused-monitor.sh --move-window Z'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Toggle floating/tiling in one shot on the focused window (e.g. Teams
    # during a call). 'layout floating tiling' checks the current state and
    # applies the other: if tiling it switches to floating, if floating it goes back to tiling.
    alt-cmd-f = 'layout floating tiling'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
